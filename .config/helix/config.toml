theme = "onedark"

[editor]
line-number = "relative"
mouse = true
cursorline = true
bufferline = "multiple"
auto-format = true
true-color = true
scrolloff = 8

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "▏"

[editor.soft-wrap]
enable = true
